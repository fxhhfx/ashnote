<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灰烬笔记 · 阅后即焚的一次性链接</title>
  <meta name="description" content="内容在浏览器内加密，服务端只存密文。对方打开一次后，密文立即从边缘节点删除。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">灰烬笔记<span>ASHNOTE</span></div>
    </header>

    <h1>把秘密交给<span class="accent">灰烬</span></h1>
    <p class="lead">
      内容在你的浏览器里加密，服务端只拿到一堆看不懂的密文。对方打开一次，密文当场从边缘节点抹掉，不留副本。
    </p>

    <div class="card">
      <label class="field-label" for="content">要传的内容</label>
      <textarea id="content" placeholder="密码、API Key、一段不方便公开说的话…"></textarea>

      <div class="row">
        <div class="chips" id="ttl-chips">
          <button class="chip" data-ttl="3600">1 小时</button>
          <button class="chip active" data-ttl="86400">1 天</button>
          <button class="chip" data-ttl="604800">7 天</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="row" style="margin-top: 0">
        <label class="chip" id="pass-toggle" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer">
          <input type="checkbox" id="use-pass" style="width: auto; margin: 0" />
          再加一层口令保护
        </label>
      </div>

      <div id="pass-box" style="display: none; margin-top: 14px">
        <label class="field-label" for="passphrase">访问口令（请另外告知对方，不要和链接一起发）</label>
        <input type="password" id="passphrase" placeholder="至少 6 位" autocomplete="new-password" />
        <div class="hint">口令用于派生加密密钥，服务端不知道口令，因此也无法解密。</div>
      </div>

      <button class="btn btn-primary" id="create-btn">生成一次性链接</button>

      <div class="msg error" id="err-msg"></div>
    </div>

    <div class="result" id="result">
      <div class="card">
        <label class="field-label">分享给对方</label>
        <div class="copy-row">
          <input type="text" id="share-link" readonly />
          <button class="btn btn-ghost btn-sm" id="copy-share">复制</button>
        </div>
        <div class="hint" id="share-hint">打开即看，看完即焚，只能看一次。</div>

        <div class="divider"></div>

        <label class="field-label">自己留着（查看是否已被读取 / 提前销毁）</label>
        <div class="copy-row">
          <input type="text" id="mgmt-link" readonly />
          <button class="btn btn-ghost btn-sm" id="copy-mgmt">复制</button>
        </div>
        <div class="hint warn">管理链接一旦丢失，就无法再确认对方是否已读，也无法提前销毁。</div>
      </div>
    </div>

    <footer class="foot">
      <div id="stats-line" class="hash">正在读取边缘计数…</div>
      <div style="margin-top: 8px">
        加密方式：AES-256-GCM 端到端加密 ｜ 密钥只存在于链接的 # 片段中，浏览器不会把它发送给服务器
      </div>
    </footer>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
